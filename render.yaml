services:
  - type: web
    name: meowlog
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meowlog-db
          property: connectionString
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ADVENTURE_DURATION_SECONDS
        value: "45"

databases:
  - name: meowlog-db
    plan: free
