name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meowlog_test
          POSTGRES_USER: meowlog
          POSTGRES_PASSWORD: meowlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meowlog -d meowlog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meowlog:meowlog@localhost:5432/meowlog_test
      ADVENTURE_DURATION_SECONDS: 15
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m backend.init_db
      - run: pytest -q
      - run: docker build -t meowlog:ci .
